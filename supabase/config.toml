# Supabase Configuration
# https://supabase.com/docs/reference/cli/config

[project]
# Use `npx supabase link --project-ref <project-ref>` to link to a project
# project_ref = "your-project-ref"

[api]
# port = 54321
# schemas = ["public"]
# max_rows = 1000

[db]
# port = 5432
# major_version = 15
# seed_seed_file_path = "supabase/seed.sql"

[realtime]
# enabled = true
# max_bytes_per_second = 1000

[auth]
# Site URL for auth redirects
# site_url = "http://localhost:5173"
# Additional redirect URLs (comma separated)
# additional_redirect_urls = ["http://localhost:3000"]

[functions."code-review"]
# Note: Uncomment to enable Supabase Functions
# import_map = "functions/_shared/import_map.json"
